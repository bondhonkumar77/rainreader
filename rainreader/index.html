<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Reader</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">

  <div class="app">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="brand"><i class="bi bi-book-half"></i> Reader</span>
        <button class="icon-btn" id="closeSidebar" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="sidebar-tabs">
        <button class="tab active" data-tab="toc"><i class="bi bi-list-ul"></i> Contents</button>
        <button class="tab" data-tab="settings"><i class="bi bi-sliders"></i> Settings</button>
      </div>

      <div class="sidebar-body">
        <!-- TOC panel -->
        <div class="tab-panel active" id="panel-toc">
          <div class="toc" id="tocList">
            <p class="empty">No book loaded</p>
          </div>
        </div>

        <!-- Settings panel -->
        <div class="tab-panel" id="panel-settings">
          <div class="setting">
            <label>Theme</label>
            <div class="theme-choices">
              <button class="theme-swatch active" data-theme-pick="light">
                <span class="sw sw-light"></span> Light
              </button>
              <button class="theme-swatch" data-theme-pick="dark">
                <span class="sw sw-dark"></span> Dark
              </button>
              <button class="theme-swatch" data-theme-pick="sepia">
                <span class="sw sw-sepia"></span> Sepia
              </button>
            </div>
          </div>

          <div class="setting">
            <label>Font Size</label>
            <div class="stepper">
              <button id="fontDec"><i class="bi bi-dash-lg"></i></button>
              <span id="fontSizeLabel">100%</span>
              <button id="fontInc"><i class="bi bi-plus-lg"></i></button>
            </div>
          </div>

          <div class="setting">
            <label>Line Height</label>
            <div class="stepper">
              <button id="lhDec"><i class="bi bi-dash-lg"></i></button>
              <span id="lhLabel">1.6</span>
              <button id="lhInc"><i class="bi bi-plus-lg"></i></button>
            </div>
          </div>

          <div class="setting">
            <label>Reading Width</label>
            <div class="stepper">
              <button id="widthDec"><i class="bi bi-dash-lg"></i></button>
              <span id="widthLabel">Medium</span>
              <button id="widthInc"><i class="bi bi-plus-lg"></i></button>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ============ MAIN ============ -->
    <main class="main">

      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Menu">
          <i class="bi bi-list"></i>
        </button>

        <div class="book-info">
          <span class="book-title" id="bookTitle">Reader</span>
          <span class="book-sub" id="bookSub">Open an eBook to begin</span>
        </div>

        <button class="icon-btn" id="openBtn" aria-label="Open file">
          <i class="bi bi-folder2-open"></i>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
          <i class="bi bi-moon-stars" id="themeIcon"></i>
        </button>
      </header>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="viewer-wrap" id="viewerWrap">
        <div id="viewer"></div>

        <div class="empty-state" id="emptyState">
          <i class="bi bi-book"></i>
          <h3>Drop an eBook here</h3>
          <p>Supports EPUB, MOBI, and AZW formats</p>
          <button class="btn-primary" id="emptyOpenBtn">
            <i class="bi bi-folder2-open"></i> Choose file
          </button>
        </div>

        <div class="loading hidden" id="loading">
          <div class="spinner"></div>
          <span>Loading…</span>
        </div>

        <div class="toast" id="toast"></div>
      </div>

      <footer class="bottombar">
        <button class="nav-btn" id="prevBtn">
          <i class="bi bi-chevron-left"></i>
          <span>Prev</span>
        </button>

        <button class="page-info" id="pageInfo" title="Jump to…">
          <span id="pageCurrent">—</span>
          <span class="divider">/</span>
          <span id="pageTotal">—</span>
        </button>

        <button class="nav-btn" id="nextBtn">
          <span>Next</span>
          <i class="bi bi-chevron-right"></i>
        </button>
      </footer>

    </main>
  </div>

  <!-- Updated to accept EPUB, MOBI, AZW, and AZW3 -->
  <input type="file" id="fileInput" accept=".epub,.mobi,.azw,.azw3,application/epub+zip,application/x-mobipocket-ebook,application/vnd.amazon.ebook" hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
